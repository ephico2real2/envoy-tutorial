# A second router - a shard - beside the default one. The ingress operator
# makes Deployment and Service router-metallb in openshift-ingress from it.
#
# This file does not touch IngressController default. ../run.sh deploy gives
# default a routeSelector (ingress-shard DoesNotExist), so it keeps the console,
# OAuth, Keycloak and every other unlabelled Route on the node's ports 80 and
# 443 (HostNetwork) and leaves this shard's Routes alone. That field is not in
# git: see ../../../argocd/ingress-shard.yaml.
#
# This one is published as a LoadBalancer Service, which MetalLB gives
# 192.168.127.130 (10-pool.yaml): its own address, so it needs no node port.
apiVersion: operator.openshift.io/v1
kind: IngressController
metadata:
  name: metallb
  namespace: openshift-ingress-operator
spec:
  # Its own domain, not a subdomain of apps-crc.testing: inside the cluster
  # *.apps-crc.testing resolves to the default router, *.apps-metallb.crc.testing
  # to nothing. It ends in .crc.testing, which CRC writes into the laptop's
  # /etc/hosts for Route hosts ending in .crc.testing or .apps-crc.testing
  # (crc-org/routes-controller, admin-helper).
  domain: apps-metallb.crc.testing
  replicas: 1
  endpointPublishingStrategy:
    type: LoadBalancerService
    loadBalancer:
      scope: External
      # No cloud DNS here: nothing for the operator to manage.
      dnsManagementPolicy: Unmanaged
  # A Route joins the shard by its own label, not by its namespace: module 20
  # puts one Route here and nothing else of its namespace. The default router
  # would admit these Routes too - it has no selector of its own - so
  # ../run.sh deploy gives it routeSelector ingress-shard DoesNotExist (the
  # README, step 5). That selector is run.sh's, not a manifest's: see
  # ../../../argocd/ingress-shard.yaml.
  routeSelector:
    matchLabels:
      ingress-shard: metallb
  defaultCertificate:
    name: router-metallb-default-cert
