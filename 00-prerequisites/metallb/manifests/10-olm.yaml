# The MetalLB Operator, from Red Hat's catalog, through OLM (README, steps 1-3).
#
# The same objects mongodb-poc applied on 2026-09-24 (its manifests/05-metallb-olm.yaml).
# mongodb-poc and modules 12-20 share them: on the operator's CRC they are never
# re-applied, only compared with `oc apply --dry-run=server`.
#
# The OperatorGroup is `spec: {}`: it selects every namespace. The operator's CSV
# supports AllNamespaces only (OwnNamespace, SingleNamespace and MultiNamespace are
# false, README step 1). An OperatorGroup with `targetNamespaces: [metallb-system]`
# leaves the CSV Failed, reason UnsupportedOperatorGroup: "OwnNamespace InstallModeType
# not supported, cannot configure to watch own namespace" (operator-framework/api,
# InstallModeSet.Supports).
#
# The namespace's pod-security labels are not set here: OpenShift adds them (README
# step 2).
apiVersion: v1
kind: Namespace
metadata:
  name: metallb-system
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: metallb-operator
  namespace: metallb-system
spec: {}
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: metallb-operator-sub
  namespace: metallb-system
spec:
  channel: stable
  name: metallb-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
