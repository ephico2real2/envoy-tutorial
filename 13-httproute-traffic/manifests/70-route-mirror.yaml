# Step 6. Every /mirror request is answered by the stable version, and a copy
# is sent to the canary, whose answer is thrown away: test a new version with
# real traffic, and no user ever sees its reply (module 04's shadowing).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mirror
  namespace: envoy-13
spec:
  parentRefs:
  - name: eg
  rules:
  - matches:
    - path: { type: PathPrefix, value: /mirror }
    filters:
    - type: RequestMirror
      requestMirror:
        backendRef: { name: canary, port: 8080 }
    backendRefs:
    - { name: echo, port: 8080 }
