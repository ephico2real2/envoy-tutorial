# Step 5. Two ways to change where a request goes.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rewrite-redirect
  namespace: envoy-13
spec:
  parentRefs:
  - name: eg
  rules:
  # Rewrite: /v2/<anything> reaches the canary as /<anything>. The client never
  # sees the change - the proxy edits the request on the way in.
  - matches:
    - path: { type: PathPrefix, value: /v2 }
    filters:
    - type: URLRewrite
      urlRewrite:
        path: { type: ReplacePrefixMatch, replacePrefixMatch: / }
    backendRefs:
    - { name: canary, port: 8080 }
  # Redirect: /old/<anything> is answered by the proxy itself with a 301
  # pointing at /new/<anything>. No backend is involved - so there is none.
  - matches:
    - path: { type: PathPrefix, value: /old }
    filters:
    - type: RequestRedirect
      requestRedirect:
        path: { type: ReplacePrefixMatch, replacePrefixMatch: /new }
        statusCode: 301
