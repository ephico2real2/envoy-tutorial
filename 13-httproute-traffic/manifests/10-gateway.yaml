apiVersion: v1
kind: Namespace
metadata:
  name: envoy-13
---
# The same kind of Gateway as module 12, in this module's own namespace. It uses
# module 12's GatewayClass "eg" (and its EnvoyProxy), which step 1 applies.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: eg
  namespace: envoy-13
spec:
  gatewayClassName: eg
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: Same
