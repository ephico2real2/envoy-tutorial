# Step 7. The slow app takes 1 s. The route allows 500 ms for the whole
# request; after that the proxy gives up and answers 504 itself.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: slow
  namespace: envoy-13
spec:
  parentRefs:
  - name: eg
  rules:
  - matches:
    - path: { type: PathPrefix, value: /slow }
    timeouts:
      request: 500ms
    backendRefs:
    - { name: slow, port: 8080 }
