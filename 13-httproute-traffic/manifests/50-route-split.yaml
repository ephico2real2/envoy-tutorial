# Step 4. One rule, two backends, weighted: about 9 requests in 10 to the
# stable version, 1 in 10 to the canary. Move the weights to shift traffic.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: split
  namespace: envoy-13
spec:
  parentRefs:
  - name: eg
  rules:
  - matches:
    - path: { type: PathPrefix, value: /split }
    backendRefs:
    - { name: echo,   port: 8080, weight: 90 }
    - { name: canary, port: 8080, weight: 10 }
