# Step 4. The same policy (same name - applying it replaces step 3's), plus
# module 11's outlier detection, which Envoy Gateway calls a passive health
# check: two 5xx in a row and a pod is ejected for 30 s.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: pool
  namespace: envoy-14
spec:
  targetRefs:
  - { group: gateway.networking.k8s.io, kind: HTTPRoute, name: pool }
  retry:
    numRetries: 1
    retryOn:
      httpStatusCodes: [503]
  healthCheck:
    passive:
      consecutive5XxErrors: 2
      interval: 1s
      baseEjectionTime: 30s
      # One pod of three is 33 %. Envoy's default, 10 %, would eject nothing
      # in a pool this small (module 11, step 6).
      maxEjectionPercent: 50
