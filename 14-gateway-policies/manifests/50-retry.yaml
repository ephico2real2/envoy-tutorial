# Step 3. Module 11's retry, as a policy: on a 503, try once more.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: pool
  namespace: envoy-14
spec:
  targetRefs:
  - { group: gateway.networking.k8s.io, kind: HTTPRoute, name: pool }
  retry:
    numRetries: 1
    retryOn:
      httpStatusCodes: [503]
