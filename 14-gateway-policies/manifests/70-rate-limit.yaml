# Step 6. Module 06's local rate limit: 3 requests a minute through /api, per
# Envoy, counted in the proxy itself - no rate-limit service involved.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: api
  namespace: envoy-14
spec:
  targetRefs:
  - { group: gateway.networking.k8s.io, kind: HTTPRoute, name: api }
  rateLimit:
    type: Local
    local:
      rules:
      - limit: { requests: 3, unit: Minute }
