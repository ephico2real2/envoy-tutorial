# Step 13. Consistent hashing, module 05's RING_HASH: the pod is chosen from a
# hash of the x-user header, so one user keeps landing on one pod - useful when
# a pod caches per user.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: sticky
  namespace: envoy-14
spec:
  targetRefs:
  - { group: gateway.networking.k8s.io, kind: HTTPRoute, name: sticky }
  loadBalancer:
    type: ConsistentHash
    consistentHash:
      type: Header
      header: { name: x-user }
