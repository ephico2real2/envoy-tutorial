# Step 5a. The same policy, expecting a name the certificate does not carry.
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: secure-echo
  namespace: envoy-15
spec:
  targetRefs:
  - { group: "", kind: Service, name: secure-echo, sectionName: https }
  validation:
    caCertificateRefs:
    - { group: "", kind: ConfigMap, name: enterprise-ca }
    hostname: payments.envoy-15.svc
