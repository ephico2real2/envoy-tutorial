# /secure goes to the TLS-only backend, on its https port. Nothing here says
# "TLS": an HTTPRoute names a Service and a port, and the Gateway speaks plain
# HTTP to it - until a BackendTLSPolicy says otherwise (step 4).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: secure
  namespace: envoy-15
spec:
  parentRefs: [{ name: eg }]
  rules:
  - matches: [{ path: { type: PathPrefix, value: /secure } }]
    backendRefs: [{ name: secure-echo, port: 8443 }]
