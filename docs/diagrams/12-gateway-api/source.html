    <h1>Who owns which object, and which API each belongs to</h1>

  <section>
    <h2>Who owns what</h2>
    <figure>
      <div class="fig-scroll">
<svg viewBox="0 0 920 468" role="img" aria-label="The cluster operator owns the GatewayClass, which names the controller, and the Gateway: ports, TLS, and who may attach. The application team&#x27;s HTTPRoute holds paths and backends and attaches to the Gateway, subject to allowedRoutes. Below them, the controller generates an Envoy Deployment and LoadBalancer Service, which you do not edit, and traffic flows down from it to your Service.">
  <defs><marker id="c1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker><marker id="c1g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--gap)"/></marker></defs>
  <g font-family="IBM Plex Sans, sans-serif" font-size="12.5" fill="currentColor">
<text x="20" y="32" fill="var(--host)" font-weight="600">cluster operator</text>
<text x="560" y="32" fill="var(--remote)" font-weight="600">application team</text>
<rect x="20" y="44" width="340" height="140" rx="7" fill="var(--host-wash)" stroke="var(--host)" stroke-width="1.3"/>
<line x1="20" y1="114" x2="360" y2="114" stroke="var(--host)" stroke-width="1.3"/>
<text x="36" y="68" font-weight="600">GatewayClass</text>
<text x="36" y="85">which controller</text>
<text x="36" y="138" font-weight="600">Gateway</text>
<text x="36" y="155">ports, TLS, who may attach</text>
<rect x="560" y="100" width="340" height="84" rx="7" fill="var(--remote-wash)" stroke="var(--remote)" stroke-width="1.3"/>
<text x="574" y="121" font-weight="600">HTTPRoute</text>
<text x="574" y="138">paths, backends</text>
<text x="574" y="155">in THEIR namespace *</text>
<line x1="560" y1="150" x2="362" y2="150" stroke="currentColor" stroke-width="1.3" marker-end="url(#c1)"/>
<text x="460" y="142" text-anchor="middle" fill="var(--muted)">attaches</text>
<text x="460" y="168" text-anchor="middle" fill="var(--muted)">(allowedRoutes)</text>
<line x1="190" y1="184" x2="190" y2="254" stroke="currentColor" stroke-width="1.3" marker-end="url(#c1)"/>
<text x="202" y="224" fill="var(--muted)">controller generates</text>
<rect x="20" y="256" width="340" height="80" rx="7" fill="var(--none-wash)" stroke="var(--none)" stroke-width="1.3"/>
<text x="34" y="277" font-weight="600">Envoy Deployment</text>
<text x="34" y="294">+ LoadBalancer Svc</text>
<text x="34" y="311" fill="var(--muted)">(you do not edit)</text>
<line x1="190" y1="336" x2="190" y2="398" stroke="currentColor" stroke-width="1.3" marker-end="url(#c1)"/>
<text x="202" y="372" fill="var(--muted)">traffic</text>
<rect x="20" y="400" width="340" height="48" rx="7" fill="none" stroke="currentColor" stroke-width="1.3"/>
<text x="34" y="429" font-weight="600">your Service</text>
<text x="560" y="226" fill="var(--muted)">* only where the Gateway&#x27;s allowedRoutes</text>
<text x="560" y="244" fill="var(--muted)">admits it. This module&#x27;s Gateway says</text>
<text x="560" y="262" fill="var(--muted)">from: Same, so its HTTPRoute sits beside it</text>
<text x="560" y="280" fill="var(--muted)">in gwapi-demo; a route from another</text>

<text x="560" y="316" fill="var(--muted)">NotAllowedByListeners.</text>

</svg>

      <figcaption>The cluster operator owns the GatewayClass and the Gateway; the application team&#x27;s HTTPRoute attaches to it, subject to allowedRoutes; the controller generates the Envoy Deployment and LoadBalancer Service.</figcaption>

  <section>

    <figure>

  <g font-family="IBM Plex Sans, sans-serif" font-size="12.5" fill="currentColor">
<text x="20" y="30" font-weight="600">what YOU write</text>

<rect x="20" y="44" width="300" height="80" rx="7" fill="var(--remote-wash)" stroke="var(--remote)" stroke-width="1.3"/>
<text x="34" y="65" font-weight="600">Gateway</text>
<text x="34" y="82">HTTPRoute  /  GRPCRoute</text>
<text x="34" y="99" font-family="IBM Plex Mono, monospace" font-size="12">gateway.networking.k8s.io</text>

<text x="516" y="104" font-weight="600" fill="var(--remote)">the STANDARD api</text>
<text x="516" y="121" font-family="IBM Plex Mono, monospace" font-size="12">gateway.networking.k8s.io</text>
<text x="516" y="138" fill="var(--muted)">portable across vendors</text>
<rect x="380" y="188" width="240" height="60" rx="7" fill="none" stroke="currentColor" stroke-width="1.3"/>
<text x="394" y="209" font-weight="600">a Gateway controller</text>
<text x="394" y="226" fill="var(--muted)">(Envoy Gateway here)</text>
<rect x="20" y="312" width="300" height="80" rx="7" fill="var(--host-wash)" stroke="var(--host)" stroke-width="1.3"/>
<text x="34" y="333" font-weight="600">EnvoyProxy</text>
<text x="34" y="350">SecurityPolicy   etc.</text>

<path d="M320,352 H500 V250" fill="none" stroke="currentColor" stroke-width="1.3" marker-end="url(#c2)"/>
<text x="516" y="300" fill="var(--host)" font-weight="600">VENDOR extensions</text>
<text x="516" y="317" font-family="IBM Plex Mono, monospace" font-size="12">gateway.envoyproxy.io</text>
<text x="516" y="334" fill="var(--muted)">Envoy Gateway only</text>
  </g>
</svg>
      </div>
      <figcaption>The standard gateway.networking.k8s.io API is portable across vendors; the gateway.envoyproxy.io extensions are Envoy Gateway only. One controller implements both.</figcaption>
    </figure>
  </section>
