    <h1>Two routers, one label between them</h1>
    <p class="lede">Drawn from <code>00-prerequisites/ingress-shard/manifests/</code> and <code>run.sh</code>; every answer was measured on CRC when the README was walked (2026-09-27).</p>

ontroller for Route hosts ending in .crc.testing or .apps-crc.testing. All measured on CRC on 2026-09-27.">
