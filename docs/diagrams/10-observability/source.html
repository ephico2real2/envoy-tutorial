<title>Envoy Observability</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root {
  --ground: #f5f6f8; --surface: #ffffff; --ink: #18212c; --muted: #58636f; --rule: #d7dce3;
  --host: #a55a0b; --host-wash: #fbf1e4; --remote: #0e6f68; --remote-wash: #e3f3f1;
  --gap: #b3261e; --gap-wash: #fbe9e7; --none: #6b7684; --none-wash: #eef0f3;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground: #0e131a; --surface: #151c25; --ink: #e5e9ef; --muted: #9aa5b3; --rule: #2a3440;
    --host: #f0a53c; --host-wash: #2a2014; --remote: #3fcfc0; --remote-wash: #122a28;
    --gap: #f2857c; --gap-wash: #2d1614; --none: #9aa5b3; --none-wash: #1b232d;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #0e131a; --surface: #151c25; --ink: #e5e9ef; --muted: #9aa5b3; --rule: #2a3440;
  --host: #f0a53c; --host-wash: #2a2014; --remote: #3fcfc0; --remote-wash: #122a28;
  --gap: #f2857c; --gap-wash: #2d1614; --none: #9aa5b3; --none-wash: #1b232d;
}
* { box-sizing: border-box; }
body { background: var(--ground); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55; margin: 0; }
.page { max-width: 1060px; margin: 0 auto; padding-inline: 16px; padding-block: 40px 72px; display: grid; gap: 44px; }
header { display: grid; gap: 10px; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { font-size: clamp(26px, 4vw, 36px); line-height: 1.15; margin: 0; font-weight: 700; text-wrap: balance; }
h2 { font-size: 20px; margin: 0 0 6px; font-weight: 600; text-wrap: balance; }
p { margin: 0; max-width: 72ch; }
.lede { font-size: 17px; max-width: 70ch; }
.muted { color: var(--muted); }
code { font-family: var(--font-mono); font-size: .9em; }
section { display: grid; gap: 14px; }
figure { margin: 0; display: grid; gap: 10px; }
.fig-scroll { overflow-x: auto; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 12px; }
.fig-scroll svg { display: block; width: 100%; min-width: 760px; height: auto; color: var(--ink); }
figcaption { font-size: 13.5px; color: var(--muted); max-width: 80ch; }
.tbl { overflow-x: auto; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; vertical-align: top; padding: 10px 14px; border-bottom: 1px solid var(--rule); }
th { font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); background: var(--ground); }
tr:last-child td { border-bottom: 0; }
.yes { color: var(--remote); font-weight: 600; } .no { color: var(--gap); font-weight: 600; }
.cell-gap { background: var(--gap-wash); }
.decisions { display: grid; gap: 12px; }
.decision { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 16px 20px; display: grid; gap: 8px; }
.decision .id { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.decision .q { font-weight: 600; }
.decision .rec { font-size: 14px; border-left: 3px solid var(--remote); padding-left: 10px; }
.decision .rec.warn { border-left-color: var(--host); }
a { color: var(--remote); }
:focus-visible { outline: 2px solid var(--remote); outline-offset: 2px; }
</style>

<div class="page">
  <header>
    <div class="eyebrow">envoy-tutorial · module 10 · observability</div>
    <h1>One request, three records</h1>
    <p class="lede">Drawn from <code>10-observability/manifests/10-envoy-config.yaml</code>; the log line and trace were measured on CRC in namespace <code>envoy-10</code>.</p>
  </header>

  <section>
    <h2>Metrics, logs and traces</h2>
    <figure>
      <div class="fig-scroll">
<svg viewBox="0 0 980 520" role="img" aria-label="One request to /down, which has no endpoint, produces three records. Envoy&#x27;s metrics count it as a 5xx on /stats/prometheus, scraped by OpenShift&#x27;s user-workload monitoring and graphed in the console. The access log describes it: code 503, flag UH, no_healthy_upstream, with a trace_id. That trace_id opens the Zipkin trace, whose span carries status 503, response flag UH and error true.">
  <defs><marker id="o1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker><marker id="o1g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--gap)"/></marker></defs>
  <g font-family="IBM Plex Sans, sans-serif" font-size="12.5" fill="currentColor">
<rect x="330" y="12" width="320" height="44" rx="7" fill="var(--none-wash)" stroke="var(--none)" stroke-width="1.3"/>
<text x="344" y="39" font-weight="600">client — GET /down</text>
<line x1="490" y1="56" x2="490" y2="90" stroke="currentColor" stroke-width="1.3" marker-end="url(#o1)"/>
<rect x="250" y="92" width="480" height="70" rx="7" fill="var(--remote-wash)" stroke="var(--remote)" stroke-width="1.3"/>
<text x="264" y="113" font-family="IBM Plex Mono, monospace" font-size="12.5" font-weight="600" fill="var(--remote)">ENVOY</text>
<text x="264" y="130">no endpoint for cluster down → 503</text>
<text x="264" y="147" fill="var(--muted)">one request, three records of it</text>
<line x1="330" y1="162" x2="170" y2="212" stroke="currentColor" stroke-width="1.3" marker-end="url(#o1)"/>
<line x1="490" y1="162" x2="490" y2="212" stroke="currentColor" stroke-width="1.3" marker-end="url(#o1)"/>
<line x1="650" y1="162" x2="810" y2="212" stroke="currentColor" stroke-width="1.3" marker-end="url(#o1)"/>
<rect x="20" y="214" width="300" height="130" rx="7" fill="var(--none-wash)" stroke="var(--none)" stroke-width="1.3"/>
<text x="34" y="235" font-family="IBM Plex Mono, monospace" font-size="12.5" font-weight="600" fill="var(--remote)">METRICS — counted</text>
<text x="34" y="252" font-family="IBM Plex Mono, monospace" font-size="12">/stats/prometheus on :9901</text>
<text x="34" y="269">downstream_rq_xx, class 5 +1</text>
<text x="34" y="286" fill="var(--muted)">scraped every 15 s by user-</text>
<text x="34" y="303" fill="var(--muted)">workload monitoring</text>
<rect x="340" y="214" width="300" height="130" rx="7" fill="var(--none-wash)" stroke="var(--none)" stroke-width="1.3"/>
<text x="354" y="235" font-family="IBM Plex Mono, monospace" font-size="12.5" font-weight="600" fill="var(--remote)">LOG — described</text>
<text x="354" y="252" font-family="IBM Plex Mono, monospace" font-size="12">&quot;code&quot;:503</text>
<text x="354" y="269" font-family="IBM Plex Mono, monospace" font-size="12">&quot;flags&quot;:&quot;UH&quot;</text>
<text x="354" y="286" font-family="IBM Plex Mono, monospace" font-size="12">&quot;details&quot;:&quot;no_healthy_upstream&quot;</text>
<text x="354" y="303" font-family="IBM Plex Mono, monospace" font-size="12">&quot;trace_id&quot;:&quot;e8fd…&quot;</text>
<rect x="660" y="214" width="300" height="130" rx="7" fill="var(--none-wash)" stroke="var(--none)" stroke-width="1.3"/>
<text x="674" y="235" font-family="IBM Plex Mono, monospace" font-size="12.5" font-weight="600" fill="var(--remote)">TRACE — timed</text>
<text x="674" y="252">a span sent to Zipkin</text>
<text x="674" y="269" font-family="IBM Plex Mono, monospace" font-size="12">http.status_code 503</text>
<text x="674" y="286" font-family="IBM Plex Mono, monospace" font-size="12">response_flags UH</text>
<text x="674" y="303" font-family="IBM Plex Mono, monospace" font-size="12">error true</text>
<line x1="640" y1="320" x2="658" y2="320" stroke="currentColor" stroke-width="1.3" marker-end="url(#o1)"/>
<text x="608" y="364" fill="var(--muted)">trace_id</text>
<line x1="170" y1="344" x2="170" y2="384" stroke="currentColor" stroke-width="1.3" marker-end="url(#o1)"/>
<rect x="20" y="386" width="300" height="70" rx="7" fill="var(--host-wash)" stroke="var(--host)" stroke-width="1.3"/>
<text x="34" y="407" font-weight="600">OpenShift console</text>
<text x="34" y="424">Observe → Metrics: rates and</text>
<text x="34" y="441" fill="var(--muted)">p99 over time, per namespace</text>
<text x="20" y="490" font-weight="600">Metrics say how many and how fast; the log says what happened to one request; the trace says where its time went.</text>
<text x="20" y="510" fill="var(--muted)">The log&#x27;s trace_id opens that request&#x27;s trace. Measured on CRC in envoy-10.</text>
  </g>
</svg>
      </div>
      <figcaption>Metrics count, the log describes, the trace times — and the trace_id joins the log to the trace.</figcaption>
    </figure>
  </section>
</div>
