    <div class="eyebrow">envoy-tutorial · module 18 · a realm federated from LDAP</div>
    <h1>Keycloak reads its people from the directory</h1>
    <p class="lede">Drawn from <code>18-keycloak-ldap/manifests/</code> and <code>16-keycloak/manifests/40-keycloak.yaml</code>; measured on CRC in namespaces <code>keycloak</code> and <code>ldap-testing</code>.</p>
  </header>

  <section>
    <h2>A login in realm corp</h2>
    <figure>
      <div class="fig-scroll">
<svg viewBox="0 0 1000 720" role="img" aria-label="A login in realm corp. A person, for example sarah.jones, sends a user name and password through client shop-cli to Keycloak (keycloak-0, realm corp), which a KeycloakRealmImport corp created once, with the LDAP provider, its mappers, the group-to-role mapping and the bind password from Secret keycloak-ldap-bind. Keycloak trusts the directory&#x27;s root CA from Secret ldap-root-ca, declared as an optional truststore in module 16&#x27;s Keycloak resource; the root was fetched from the route with openssl, and its SHA-256 fingerprint 0E:1F:4B:E3:...:A7:0E:14:26 matched openshift-config/ca-config-map before it was stored; a new Secret restarts Keycloak after about 45 seconds. Keycloak connects to ldaps://ldaps-ldap-testing.apps-crc.testing:443 with that name as SNI, checks the certificate&#x27;s CA and name, binds as keycloak-bind-serviceid and searches through the gate. The OpenShift router&#x27;s passthrough Route ldaps forwards the connection to OpenLDAP on 636, whose certificate from LDAP Enterprise Root CA names the public host and the Service. Keycloak then binds as the person to check the password, and reads the groups whose member is the person. Of the directory&#x27;s 11 people, the gate app-ssb-autobahnusers holds 9; bob.wilson and charlie.brown are outside it. Members of app-ocp-rbac-ocp-keycloak-admin - john.doe, alice.cooper, sarah.jones, shop.bob - get the realm role admin, and the token comes back with issuer .../realms/corp. Refusals: a root not yet trusted gives SSLHandshakeFailed, PKIX path building failed; a name not in the certificate gives No subject alternative DNS name; a person outside the gate gets invalid_grant, user_not_found. Keycloak never writes to the directory.">

    <marker id="f18g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--gap)"/></marker>
    <marker id="f18t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--remote)"/></marker>
  </defs>
  <g font-family="IBM Plex Sans, sans-serif" font-size="12.5" fill="currentColor">

<line x1="470" y1="68" x2="470" y2="104" stroke="currentColor" stroke-width="1.3" marker-end="url(#f18)"/>

<text x="568" y="90" fill="var(--remote)">⑤ a token: iss …/realms/corp, roles incl. admin</text>

<!-- namespace keycloak -->
<text x="20" y="100" font-family="IBM Plex Mono, monospace" font-size="12.5" font-weight="600" fill="var(--remote)">NAMESPACE keycloak</text>
<rect x="20" y="106" width="200" height="118" rx="7" fill="var(--host-wash)" stroke="var(--host)" stroke-width="1.3"/>
<text x="34" y="127" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="600" fill="var(--host)">KeycloakRealmImport</text>
<text x="34" y="144" font-family="IBM Plex Mono, monospace" font-size="12">corp</text>
<text x="34" y="161">LDAP provider, mappers,</text>
<text x="34" y="178">group → role admin</text>
<text x="34" y="195" fill="var(--muted)">bind password from Secret</text>
<text x="34" y="212" fill="var(--muted)">keycloak-ldap-bind</text>
<line x1="220" y1="164" x2="298" y2="164" stroke="currentColor" stroke-width="1.3" marker-end="url(#f18)"/>
<text x="228" y="156" fill="var(--muted)">creates</text>

<rect x="300" y="106" width="400" height="118" rx="7" fill="var(--remote-wash)" stroke="var(--remote)" stroke-width="1.3"/>
<text x="314" y="127" font-family="IBM Plex Mono, monospace" font-size="12.5" font-weight="600" fill="var(--remote)">Keycloak keycloak-0 · realm corp</text>
<text x="314" y="146">LDAP provider · READ_ONLY · users imported on lookup</text>
<text x="314" y="164">gate: (memberOf=cn=app-ssb-autobahnusers,…)</text>
<text x="314" y="182">groups: (cn=app-ocp-rbac-ocp-*), from member</text>
<text x="314" y="200">app-ocp-rbac-ocp-keycloak-admin → realm role admin</text>

<line x1="780" y1="164" x2="702" y2="164" stroke="currentColor" stroke-width="1.3" marker-end="url(#f18)"/>
<text x="714" y="156" fill="var(--muted)">trusts</text>
<rect x="780" y="106" width="200" height="118" rx="7" fill="var(--host-wash)" stroke="var(--host)" stroke-width="1.3"/>
<text x="794" y="127" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="600" fill="var(--host)">Keycloak (module 16)</text>
<text x="794" y="144" font-family="IBM Plex Mono, monospace" font-size="12">spec.truststores</text>
<text x="794" y="161">ldap-root-ca, optional</text>
<text x="794" y="178" fill="var(--muted)">Secret ldap-root-ca →</text>
<text x="794" y="195" fill="var(--muted)">conf/truststores/…</text>
<text x="794" y="212" fill="var(--muted)">new Secret: restart, ~45 s</text>
<line x1="880" y1="298" x2="880" y2="226" stroke="currentColor" stroke-width="1.3" marker-end="url(#f18)"/>
<text x="888" y="266" fill="var(--muted)">only on a match</text>

<!-- the CA check, east -->
<rect x="740" y="300" width="240" height="108" rx="7" fill="none" stroke="currentColor" stroke-width="1.3"/>
<text x="754" y="321" font-weight="600">the CA, checked out of band</text>
<text x="754" y="339" font-family="IBM Plex Mono, monospace" font-size="12">openssl s_client -showcerts</text>
<text x="754" y="357">self-signed root, SHA-256</text>
<text x="754" y="375">0E:1F:4B:E3:…:A7:0E:14:26</text>
<text x="754" y="393" fill="var(--muted)">= openshift-config/ca-config-map</text>
<path d="M682,450 H860 V410" fill="none" stroke="currentColor" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#f18)"/>
<text x="694" y="468" fill="var(--muted)">the chain, via the route, with SNI</text>

<!-- down the main path -->
<line x1="470" y1="224" x2="470" y2="300" stroke="currentColor" stroke-width="1.3" marker-end="url(#f18)"/>
<text x="478" y="246" fill="var(--muted)">② ldaps://ldaps-ldap-testing.apps-crc.testing:443</text>
<text x="478" y="263" fill="var(--muted)">SNI = that name · cert checked: CA and name</text>
<text x="478" y="280" fill="var(--muted)">bind as keycloak-bind-serviceid, search through the gate</text>

<!-- failures, west -->
<line x1="468" y1="290" x2="292" y2="290" stroke="var(--gap)" stroke-width="1.3" marker-end="url(#f18g)"/>
<rect x="20" y="236" width="270" height="178" rx="7" fill="var(--gap-wash)" stroke="var(--gap)" stroke-width="1.3"/>
<text x="34" y="257" font-weight="600" fill="var(--gap)">refused — what each one returns</text>
<text x="34" y="277">root not trusted yet:</text>
<text x="34" y="293" fill="var(--muted)">SSLHandshakeFailed</text>
<text x="34" y="309" fill="var(--muted)">log: PKIX path building failed</text>
<text x="34" y="331">a name not in the certificate:</text>
<text x="34" y="347" fill="var(--muted)">SSLHandshakeFailed</text>
<text x="34" y="363" fill="var(--muted)">log: No subject alternative DNS name</text>
<text x="34" y="385">outside the gate (bob.wilson):</text>
<text x="34" y="401" fill="var(--muted)">invalid_grant · log: user_not_found</text>

<rect x="300" y="302" width="380" height="56" rx="7" fill="none" stroke="currentColor" stroke-width="1.3"/>
<text x="314" y="323" font-weight="600">OpenShift router :443 · Route ldaps</text>
<text x="314" y="340" fill="var(--muted)">passthrough: routes by SNI, never decrypts</text>
<line x1="470" y1="358" x2="470" y2="394" stroke="currentColor" stroke-width="1.3" marker-end="url(#f18)"/>

<text x="20" y="446" font-family="IBM Plex Mono, monospace" font-size="12.5" font-weight="600" fill="var(--remote)">NAMESPACE ldap-testing</text>
<rect x="300" y="396" width="380" height="110" rx="7" fill="var(--remote-wash)" stroke="var(--remote)" stroke-width="1.3"/>
<text x="314" y="417" font-family="IBM Plex Mono, monospace" font-size="12.5" font-weight="600" fill="var(--remote)">OpenLDAP (slapd) :636</text>
<text x="314" y="436">certificate by LDAP Enterprise Root CA, names</text>
<text x="314" y="454">ldaps-ldap-testing.apps-crc.testing + the Service</text>
<text x="314" y="472">③ bind as the person = the password check</text>
<text x="314" y="490">④ groups whose member is the person</text>

<line x1="470" y1="506" x2="470" y2="540" stroke="currentColor" stroke-width="1.3" marker-end="url(#f18)"/>
<rect x="160" y="542" width="660" height="92" rx="7" fill="none" stroke="currentColor" stroke-width="1.3"/>
<text x="174" y="563" font-weight="600">the directory: 11 people under ou=People</text>
<text x="174" y="582">gate app-ssb-autobahnusers (groupOfUniqueNames, memberOf): 9 — bob.wilson, charlie.brown outside</text>
<text x="174" y="601">app-ocp-rbac-ocp-keycloak-admin (groupOfNames): john.doe, alice.cooper, sarah.jones, shop.bob</text>
<text x="174" y="620" fill="var(--muted)">Keycloak never writes here: READ_ONLY, and its bind account may only read People and Groups</text>

<text x="20" y="672" font-weight="600">The directory decides who may log in and who is in which group; the realm file decides what a group may do.</text>
<text x="20" y="694" fill="var(--muted)">Measured on CRC: Red Hat build of Keycloak 26.6.7, sarah.jones's token decoded (admin), lateef.o's (no admin), bob.wilson refused.</text>
  </g>
</svg>
      </div>
      <figcaption>A login in realm corp: Keycloak looks the person up in LDAP through the login gate, over the directory's public LDAPS name, trusting only the root CA checked against the PKI owner's copy; an LDAP group becomes the role admin.</figcaption>
