<style>
:root {
  --ground: #f5f6f8; --surface: #ffffff; --ink: #18212c; --muted: #58636f; --rule: #d7dce3;
  --host: #a55a0b; --host-wash: #fbf1e4; --remote: #0e6f68; --remote-wash: #e3f3f1;
  --gap: #b3261e; --gap-wash: #fbe9e7; --none: #6b7684; --none-wash: #eef0f3;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground: #0e131a; --surface: #151c25; --ink: #e5e9ef; --muted: #9aa5b3; --rule: #2a3440;
    --host: #f0a53c; --host-wash: #2a2014; --remote: #3fcfc0; --remote-wash: #122a28;
    --gap: #f2857c; --gap-wash: #2d1614; --none: #9aa5b3; --none-wash: #1b232d;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #0e131a; --surface: #151c25; --ink: #e5e9ef; --muted: #9aa5b3; --rule: #2a3440;
  --host: #f0a53c; --host-wash: #2a2014; --remote: #3fcfc0; --remote-wash: #122a28;
  --gap: #f2857c; --gap-wash: #2d1614; --none: #9aa5b3; --none-wash: #1b232d;
}
* { box-sizing: border-box; }
body { background: var(--ground); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55; margin: 0; }
.page { max-width: 1060px; margin: 0 auto; padding-inline: 16px; padding-block: 40px 72px; display: grid; gap: 44px; }
header { display: grid; gap: 10px; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { font-size: clamp(26px, 4vw, 36px); line-height: 1.15; margin: 0; font-weight: 700; text-wrap: balance; }
h2 { font-size: 20px; margin: 0 0 6px; font-weight: 600; text-wrap: balance; }
p { margin: 0; max-width: 72ch; }
.lede { font-size: 17px; max-width: 70ch; }
.muted { color: var(--muted); }
code { font-family: var(--font-mono); font-size: .9em; }
section { display: grid; gap: 14px; }
figure { margin: 0; display: grid; gap: 10px; }
.fig-scroll { overflow-x: auto; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 12px; }
.fig-scroll svg { display: block; width: 100%; min-width: 760px; height: auto; color: var(--ink); }
figcaption { font-size: 13.5px; color: var(--muted); max-width: 80ch; }
.tbl { overflow-x: auto; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; vertical-align: top; padding: 10px 14px; border-bottom: 1px solid var(--rule); }
th { font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); background: var(--ground); }
tr:last-child td { border-bottom: 0; }
.yes { color: var(--remote); font-weight: 600; } .no { color: var(--gap); font-weight: 600; }
.cell-gap { background: var(--gap-wash); }
.decisions { display: grid; gap: 12px; }
.decision { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 16px 20px; display: grid; gap: 8px; }
.decision .id { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.decision .q { font-weight: 600; }
.decision .rec { font-size: 14px; border-left: 3px solid var(--remote); padding-left: 10px; }
.decision .rec.warn { border-left-color: var(--host); }
a { color: var(--remote); }
:focus-visible { outline: 2px solid var(--remote); outline-offset: 2px; }
</style>

<div class="page">
  <header>

    <h1>Policies attach to routes</h1>
    <p class="lede">Drawn from <code>14-gateway-policies/manifests/</code>; every result was measured on CRC in namespace <code>envoy-14</code>.</p>

  <section>

    <figure>
      <div class="fig-scroll">
<svg viewBox="0 0 980 410" role="img" aria-label="Three plain HTTPRoutes, /pool, /slow and /api, with no retry, limit or authentication in them. Policies attach to them with targetRefs: a BackendTrafficPolicy on pool with a retry on 503 and a passive health check; a BackendTrafficPolicy on slow with a circuit breaker of 2 in flight and 2 waiting; on api, a BackendTrafficPolicy rate limit of 3 a minute and a SecurityPolicy with JWT and CORS. Envoy got: for pool, a route retry_policy with previous_hosts and 5 picks added by Envoy Gateway, and cluster outlier detection that ejected the sick pod; for slow, cluster circuit breakers, of 10 at once 2 served, sometimes 3 or more, and the rest refused at once; for api, the filters cors, jwt_authn, local_ratelimit in Envoy Gateway&#x27;s order, 401 without a token, 429 after 3, and the token forwarded to the app.">
  <defs><marker id="q1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker><marker id="q1g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--gap)"/></marker></defs>
  <g font-family="IBM Plex Sans, sans-serif" font-size="12.5" fill="currentColor">
<text x="20" y="22" font-family="IBM Plex Mono, monospace" font-size="12.5" font-weight="600" fill="var(--remote)">THE ROUTES — plain, unchanged</text>

<text x="674" y="53" font-weight="600">HTTPRoute api · /api</text>
<text x="674" y="70" fill="var(--muted)">no retry, no limit, no auth in it</text>

<line x1="170" y1="128" x2="170" y2="88" stroke="currentColor" stroke-width="1.3" marker-end="url(#q1)"/>
<line x1="170" y1="200" x2="170" y2="250" stroke="currentColor" stroke-width="1.3" marker-end="url(#q1)"/>

<text x="184" y="240" font-family="IBM Plex Mono, monospace" font-size="12.5" font-weight="600" fill="var(--remote)">WHAT ENVOY GOT — config_dump</text>
<rect x="20" y="252" width="300" height="92" rx="7" fill="var(--remote-wash)" stroke="var(--remote)" stroke-width="1.3"/>
<text x="34" y="273" font-family="IBM Plex Mono, monospace" font-size="12.5" font-weight="600" fill="var(--remote)">route: retry_policy</text>

<text x="354" y="290">max_requests 2 · max_pending 2</text>
<text x="354" y="307" fill="var(--muted)">10 at once: 2 served (now and then 3+),</text>

<rect x="660" y="252" width="300" height="92" rx="7" fill="var(--remote-wash)" stroke="var(--remote)" stroke-width="1.3"/>

<text x="674" y="290" font-family="IBM Plex Mono, monospace" font-size="12">cors → jwt_authn → local_ratelimit</text>

<text x="674" y="324" fill="var(--muted)">the token forwarded to the app</text>
<text x="20" y="378" font-weight="600">A policy changes how traffic through a route is handled without changing the route; Envoy Gateway writes route, cluster or filter config.</text>
<text x="20" y="398" fill="var(--muted)">A route change arrives in under a second; a cluster change takes about 15 s (initial_fetch_timeout). Measured on CRC in envoy-14.</text>
  </g>
</svg>
      </div>
      <figcaption>BackendTrafficPolicy and SecurityPolicy target a route; Envoy Gateway turns each into route, cluster or filter config.</figcaption>
