<title>Envoy Resilience</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root {
  --ground: #f5f6f8; --surface: #ffffff; --ink: #18212c; --muted: #58636f; --rule: #d7dce3;
  --host: #a55a0b; --host-wash: #fbf1e4; --remote: #0e6f68; --remote-wash: #e3f3f1;
  --gap: #b3261e; --gap-wash: #fbe9e7; --none: #6b7684; --none-wash: #eef0f3;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground: #0e131a; --surface: #151c25; --ink: #e5e9ef; --muted: #9aa5b3; --rule: #2a3440;
    --host: #f0a53c; --host-wash: #2a2014; --remote: #3fcfc0; --remote-wash: #122a28;
    --gap: #f2857c; --gap-wash: #2d1614; --none: #9aa5b3; --none-wash: #1b232d;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #0e131a; --surface: #151c25; --ink: #e5e9ef; --muted: #9aa5b3; --rule: #2a3440;
  --host: #f0a53c; --host-wash: #2a2014; --remote: #3fcfc0; --remote-wash: #122a28;
  --gap: #f2857c; --gap-wash: #2d1614; --none: #9aa5b3; --none-wash: #1b232d;
}
* { box-sizing: border-box; }
body { background: var(--ground); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55; margin: 0; }
.page { max-width: 1060px; margin: 0 auto; padding-inline: 16px; padding-block: 40px 72px; display: grid; gap: 44px; }
header { display: grid; gap: 10px; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { font-size: clamp(26px, 4vw, 36px); line-height: 1.15; margin: 0; font-weight: 700; text-wrap: balance; }
h2 { font-size: 20px; margin: 0 0 6px; font-weight: 600; text-wrap: balance; }
p { margin: 0; max-width: 72ch; }
.lede { font-size: 17px; max-width: 70ch; }
.muted { color: var(--muted); }
code { font-family: var(--font-mono); font-size: .9em; }
section { display: grid; gap: 14px; }
figure { margin: 0; display: grid; gap: 10px; }
.fig-scroll { overflow-x: auto; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 12px; }
.fig-scroll svg { display: block; width: 100%; min-width: 760px; height: auto; color: var(--ink); }
figcaption { font-size: 13.5px; color: var(--muted); max-width: 80ch; }
.tbl { overflow-x: auto; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; vertical-align: top; padding: 10px 14px; border-bottom: 1px solid var(--rule); }
th { font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); background: var(--ground); }
tr:last-child td { border-bottom: 0; }
.yes { color: var(--remote); font-weight: 600; } .no { color: var(--gap); font-weight: 600; }
.cell-gap { background: var(--gap-wash); }
.decisions { display: grid; gap: 12px; }
.decision { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 16px 20px; display: grid; gap: 8px; }
.decision .id { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.decision .q { font-weight: 600; }
.decision .rec { font-size: 14px; border-left: 3px solid var(--remote); padding-left: 10px; }
.decision .rec.warn { border-left-color: var(--host); }
a { color: var(--remote); }
:focus-visible { outline: 2px solid var(--remote); outline-offset: 2px; }
</style>

<div class="page">
  <header>
    <div class="eyebrow">envoy-tutorial · module 11 · resilience</div>
    <h1>Retries, ejection, circuit breaking</h1>
    <p class="lede">Drawn from <code>11-resilience/manifests/10-envoy-config.yaml</code>; every count was measured on CRC in namespace <code>envoy-11</code>.</p>
  </header>

  <section>
    <h2>Three retry settings, one sick pod</h2>
    <figure>
      <div class="fig-scroll">
<svg viewBox="0 0 980 636" role="img" aria-label="The same request to three routes. Envoy picks one of three Ready pods at random: two echo pods answer 200, the sick pod answers 503. In every column the first attempt lands on the sick pod, one request in three. With no retry, the 503 goes to the client: 21 of 90 failed. With a plain retry, the second attempt is a new random pick, sick again one time in three, giving 503 with flag URX: 7 of 90 failed. With previous_hosts, the retry rejects the sick pod and picks again up to three more times; only if all four picks are the sick pod does it fail, one retry in 81: 0 of 180 failed.">
  <defs><marker id="r1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker><marker id="r1g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--gap)"/></marker></defs>
  <g font-family="IBM Plex Sans, sans-serif" font-size="12.5" fill="currentColor">
<rect x="390" y="12" width="200" height="40" rx="7" fill="none" stroke="currentColor" stroke-width="1.3"/>
<text x="404" y="37" font-weight="600">client — GET</text>
<line x1="490" y1="52" x2="490" y2="78" stroke="currentColor" stroke-width="1.3" marker-end="url(#r1)"/>
<rect x="290" y="80" width="400" height="56" rx="7" fill="var(--remote-wash)" stroke="var(--remote)" stroke-width="1.3"/>
<text x="304" y="101" font-family="IBM Plex Mono, monospace" font-size="12.5" font-weight="600" fill="var(--remote)">ENVOY — cluster pool, lb_policy RANDOM</text>
<text x="304" y="118" fill="var(--muted)">every attempt picks one of the 3 pods at random</text>
<line x1="490" y1="136" x2="490" y2="162" stroke="currentColor" stroke-width="1.3" marker-end="url(#r1)"/>
<rect x="250" y="164" width="480" height="78" rx="7" fill="none" stroke="currentColor" stroke-width="1.3"/>
<text x="264" y="185" font-weight="600">the pool — all three pods are Ready</text>
<rect x="266" y="196" width="140" height="30" rx="6" fill="var(--remote-wash)" stroke="var(--remote)"/>
<text x="336.0" y="216" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="600" fill="var(--remote)">echo → 200</text>
<rect x="420" y="196" width="140" height="30" rx="6" fill="var(--remote-wash)" stroke="var(--remote)"/>
<text x="490.0" y="216" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="600" fill="var(--remote)">echo → 200</text>
<rect x="574" y="196" width="140" height="30" rx="6" fill="var(--gap-wash)" stroke="var(--gap)"/>
<text x="644.0" y="216" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="600" fill="var(--gap)">sick → 503</text>
<rect x="20" y="272" width="300" height="30" rx="6" fill="none" stroke="currentColor"/>
<text x="170.0" y="292" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="600" fill="currentColor">/none</text>
<rect x="20" y="316" width="300" height="56" rx="7" fill="var(--none-wash)" stroke="var(--none)" stroke-width="1.3"/>
<text x="34" y="337" font-weight="600">attempt 1 lands on sick → 503</text>
<text x="34" y="354" fill="var(--muted)">1 request in 3</text>
<line x1="170" y1="302" x2="170" y2="314" stroke="currentColor" stroke-width="1.3" marker-end="url(#r1)"/>
<line x1="170" y1="372" x2="170" y2="398" stroke="currentColor" stroke-width="1.3" marker-end="url(#r1)"/>
<line x1="170" y1="490" x2="170" y2="516" stroke="currentColor" stroke-width="1.3" marker-end="url(#r1)"/>
<rect x="340" y="272" width="300" height="30" rx="6" fill="none" stroke="currentColor"/>
<text x="490.0" y="292" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="600" fill="currentColor">/retry</text>
<rect x="340" y="316" width="300" height="56" rx="7" fill="var(--none-wash)" stroke="var(--none)" stroke-width="1.3"/>
<text x="354" y="337" font-weight="600">attempt 1 lands on sick → 503</text>
<text x="354" y="354" fill="var(--muted)">1 request in 3</text>
<line x1="490" y1="302" x2="490" y2="314" stroke="currentColor" stroke-width="1.3" marker-end="url(#r1)"/>

<text x="674" y="354" fill="var(--muted)">1 request in 3</text>
<line x1="810" y1="302" x2="810" y2="314" stroke="currentColor" stroke-width="1.3" marker-end="url(#r1)"/>
<line x1="810" y1="372" x2="810" y2="398" stroke="currentColor" stroke-width="1.3" marker-end="url(#r1)"/>

<text x="34" y="421" fill="var(--gap)" font-weight="600">no retry</text>

<text x="34" y="455"></text>
<rect x="340" y="400" width="300" height="90" rx="7" fill="var(--host-wash)" stroke="var(--host)" stroke-width="1.3"/>
<text x="354" y="421" font-weight="600">attempt 2: a new random pick</text>
<text x="354" y="438">sick again 1 time in 3</text>
<text x="354" y="455" fill="var(--gap)" font-weight="600">→ 503, flag URX</text>
<rect x="660" y="400" width="300" height="90" rx="7" fill="var(--remote-wash)" stroke="var(--remote)" stroke-width="1.3"/>
<text x="674" y="421" font-weight="600">attempt 2: previous_hosts rejects sick</text>
<text x="674" y="438">and picks again, up to 3 more times</text>
<text x="674" y="455" fill="var(--muted)">all 4 picks sick: 1 retry in 81 → URX</text>
<rect x="20" y="518" width="300" height="50" rx="7" fill="none" stroke="currentColor" stroke-width="1.3"/>
<text x="34" y="539" fill="var(--gap)" font-weight="600">failed: 21 of 90</text>
<text x="34" y="556" fill="var(--muted)">expected about 1 in 3</text>
<rect x="340" y="518" width="300" height="50" rx="7" fill="none" stroke="currentColor" stroke-width="1.3"/>
<text x="354" y="539" fill="var(--gap)" font-weight="600">failed: 7 of 90</text>
<text x="354" y="556" fill="var(--muted)">expected about 1 in 9</text>
<rect x="660" y="518" width="300" height="50" rx="7" fill="none" stroke="currentColor" stroke-width="1.3"/>
<text x="674" y="539" fill="var(--remote)" font-weight="600">failed: 0 of 180</text>
<text x="674" y="556" fill="var(--muted)">expected about 1 in 243 — seen once in 361</text>
<text x="20" y="604" font-weight="600">A retry is load-balanced like any request; previous_hosts makes a repeat unlikely, not impossible.</text>
<text x="20" y="624" fill="var(--muted)">Counts from steps 3–5, measured on CRC in envoy-11. After 4 rejected picks Envoy uses the last one (load_balancer_impl.cc).</text>
  </g>
</svg>
      </div>
      <figcaption>A retry is load-balanced like any request: previous_hosts steers it away from the pod that failed, but only 4 picks deep.</figcaption>
    </figure>
  </section>

  <section>
    <h2>Ejecting a failing pod; refusing the excess</h2>
    <figure>
      <div class="fig-scroll">
<svg viewBox="0 0 980 388" role="img" aria-label="Left, outlier detection on /ejecting: in the first 30 requests the sick pod fails twice in a row and is ejected, measured 28 200s and 2 503s. It is ejected for 30 seconds with health flag failed_outlier_check while Kubernetes still reports it Ready; the next 30 requests all succeed. Thirty seconds later it is let back in, fails twice and is ejected again - for 30 seconds again, measured, because it had been back for longer than the 1-second interval. Right, the circuit breaker on /slow: 10 requests at once to an app that takes one second; with max_requests 2 and max_pending_requests 2, 2 are served after one second and 8 are refused at once with 503 flag UO; pending_overflow 1 plus active_overflow 7 equals 8.">
  <defs><marker id="r2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker><marker id="r2g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--gap)"/></marker></defs>
  <g font-family="IBM Plex Sans, sans-serif" font-size="12.5" fill="currentColor">
<text x="20" y="24" font-family="IBM Plex Mono, monospace" font-size="12.5" font-weight="600" fill="var(--remote)">OUTLIER DETECTION — /ejecting</text>
<rect x="20" y="40" width="450" height="74" rx="7" fill="var(--gap-wash)" stroke="var(--gap)" stroke-width="1.3"/>
<text x="34" y="61" font-weight="600">requests 1–30: sick fails twice in a row</text>
<text x="34" y="78">consecutive_5xx: 2 → the pod is ejected</text>
<text x="34" y="95" fill="var(--muted)">measured: 28 × 200, 2 × 503</text>
<line x1="245" y1="114" x2="245" y2="140" stroke="currentColor" stroke-width="1.3" marker-end="url(#r2)"/>
<rect x="20" y="142" width="450" height="74" rx="7" fill="var(--remote-wash)" stroke="var(--remote)" stroke-width="1.3"/>
<text x="34" y="163" font-weight="600">ejected for 30 s — health flag /failed_outlier_check</text>
<text x="34" y="180">still Ready to Kubernetes; only Envoy stops using it</text>
<text x="34" y="197" fill="var(--muted)">requests 31–60 measured: 30 × 200</text>
<line x1="245" y1="216" x2="245" y2="242" stroke="currentColor" stroke-width="1.3" marker-end="url(#r2)"/>
<rect x="20" y="244" width="450" height="74" rx="7" fill="var(--host-wash)" stroke="var(--host)" stroke-width="1.3"/>
<text x="34" y="265" font-weight="600">30 s later: let back in, fails twice, ejected again</text>
<text x="34" y="282">for 30 s again: it was back in for longer than interval (1 s)</text>
<text x="34" y="299" fill="var(--muted)">measured: 28 × 200, 2 × 503; back in after 30 s</text>
<text x="510" y="24" font-family="IBM Plex Mono, monospace" font-size="12.5" font-weight="600" fill="var(--remote)">CIRCUIT BREAKER — /slow</text>
<rect x="510" y="40" width="450" height="44" rx="7" fill="none" stroke="currentColor" stroke-width="1.3"/>
<text x="524" y="67" font-weight="600">10 requests at once; the app takes 1 s each</text>
<line x1="735" y1="84" x2="735" y2="110" stroke="currentColor" stroke-width="1.3" marker-end="url(#r2)"/>
<rect x="510" y="112" width="450" height="58" rx="7" fill="var(--remote-wash)" stroke="var(--remote)" stroke-width="1.3"/>
<text x="524" y="133" font-family="IBM Plex Mono, monospace" font-size="12.5" font-weight="600" fill="var(--remote)">ENVOY — cluster slow_limited</text>
<text x="524" y="150" font-family="IBM Plex Mono, monospace" font-size="12">max_requests: 2 · max_pending_requests: 2</text>
<line x1="620" y1="170" x2="620" y2="196" stroke="currentColor" stroke-width="1.3" marker-end="url(#r2)"/>
<line x1="850" y1="170" x2="850" y2="196" stroke="var(--gap)" stroke-width="1.3" marker-end="url(#r2g)"/>
<rect x="510" y="198" width="220" height="74" rx="7" fill="var(--remote-wash)" stroke="var(--remote)" stroke-width="1.3"/>
<text x="524" y="219" fill="var(--remote)" font-weight="600">2 served</text>
<text x="524" y="236">200 after 1.0 s</text>
<text x="524" y="253" fill="var(--muted)">the load it can take</text>
<rect x="740" y="198" width="220" height="74" rx="7" fill="var(--gap-wash)" stroke="var(--gap)" stroke-width="1.3"/>
<text x="754" y="219" fill="var(--gap)" font-weight="600">8 refused at once</text>
<text x="754" y="236">503, flag UO, within 11 ms</text>
<text x="754" y="253" fill="var(--muted)">no queue, no timeout</text>
<rect x="510" y="290" width="450" height="28" rx="7" fill="none" stroke="currentColor" stroke-width="1.3"/>
<text x="524" y="309" font-family="IBM Plex Mono, monospace" font-size="12">counters: pending_overflow 1 + active_overflow 7 = 8</text>
<text x="20" y="356" font-weight="600">A pod that keeps failing is taken out by its own traffic; a backend that cannot keep up gets only what it can take.</text>
<text x="20" y="376" fill="var(--muted)">Counts from steps 6–7, measured on CRC. Only a pod that fails again within one interval of its return gets 60 s.</text>
  </g>
</svg>
      </div>
      <figcaption>Outlier detection removes a pod by watching real answers; a circuit breaker caps what reaches a slow backend and fails the rest fast.</figcaption>
    </figure>
  </section>
</div>
