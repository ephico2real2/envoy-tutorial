# Module 08 — Envoy terminates TLS with a certificate from cert-manager.
#
#   :8443  TLS      the certificate and key from the shop-tls Secret
#   :8080  plain    for the edge Route, where the ROUTER has already
#                   terminated TLS and sends plain HTTP on
apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy-config
data:
  envoy.yaml: |
    admin:
      address:
        socket_address: { address: 0.0.0.0, port_value: 9901 }

    static_resources:
      listeners:
      - name: https
        address:
          socket_address: { address: 0.0.0.0, port_value: 8443 }
        filter_chains:
        - transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              common_tls_context:
                tls_certificates:
                # The Secret, mounted as files (see 30-envoy.yaml).
                - certificate_chain: { filename: /etc/tls/tls.crt }
                  private_key:       { filename: /etc/tls/tls.key }
          filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: https
              route_config:
                name: echo
                virtual_hosts:
                - name: echo
                  domains: ["*"]
                  routes:
                  - match: { prefix: "/" }
                    route: { cluster: echo_service }
                    response_headers_to_add:
                    - header: { key: x-envoy-listener, value: tls-8443 }
              http_filters:
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

      - name: plain
        address:
          socket_address: { address: 0.0.0.0, port_value: 8080 }
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: plain
              route_config:
                name: echo
                virtual_hosts:
                - name: echo
                  domains: ["*"]
                  routes:
                  - match: { prefix: "/" }
                    route: { cluster: echo_service }
                    response_headers_to_add:
                    - header: { key: x-envoy-listener, value: plain-8080 }
              http_filters:
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

      clusters:
      - name: echo_service
        type: STRICT_DNS
        lb_policy: ROUND_ROBIN
        connect_timeout: 1s
        load_assignment:
          cluster_name: echo_service
          endpoints:
          - lb_endpoints:
            - endpoint: { address: { socket_address: { address: echo, port_value: 8080 } } }
