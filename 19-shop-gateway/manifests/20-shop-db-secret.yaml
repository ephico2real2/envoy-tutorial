# The shop's database credentials: the user MongoDB creates on its first start,
# and the connection string the inventory service reads.
#
# LAB ONLY: the app repository's demo.sh generates this password on its first
# deploy and never commits it. Here it is a published lab value, like module 16's
# keycloak-db, so Argo CD can keep the Secret as git declares it and every step
# can be repeated. Outside a lab it comes from a vault. MongoDB reads it once,
# when it initialises its volume: changing it later locks the service out.
apiVersion: v1
kind: Secret
metadata:
  name: inventory-db
  namespace: envoy-19
stringData:
  username: inventory
  password: inventory-lab-password
  connection-string: mongodb://inventory:inventory-lab-password@inventory-db:27017/inventory?authSource=admin
