# The Gateway's Envoy talks to Keycloak itself, from inside the cluster, straight
# to its Service: to fetch realm corp's public keys (the JWT check) and to swap a
# sign-in's code for tokens (the OIDC token endpoint). A policy in envoy-19 may
# point at a Service in keycloak only if keycloak says so - this ReferenceGrant.
#
# The TLS to keycloak-service needs no policy here: module 17's BackendTLSPolicy
# keycloak/keycloak-service applies to every Gateway that reaches that Service,
# and a Service port takes one BackendTLSPolicy (README, "Before you start").
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: envoy-19-signs-in-with-keycloak
  namespace: keycloak
spec:
  from:
  - { group: gateway.envoyproxy.io, kind: SecurityPolicy, namespace: envoy-19 }
  to:
  - { group: "", kind: Service, name: keycloak-service }
