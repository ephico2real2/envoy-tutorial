# The secret the Gateway proves it is client shop-kiosk with, when it swaps a
# sign-in's code for tokens at Keycloak's token endpoint (HTTP Basic auth). Envoy
# Gateway reads it from the key client-secret, in the SecurityPolicy's namespace.
#
# LAB ONLY: a published lab value, the same one realm corp's import gives the
# client (../18-keycloak-ldap/manifests/20-realm.yaml), like module 16's
# orders-service-lab-secret - so the steps can be repeated. Outside a lab both
# come from a vault, and neither file holds the value.
apiVersion: v1
kind: Secret
metadata:
  name: shop-kiosk-oidc
  namespace: envoy-19
stringData:
  client-secret: shop-kiosk-lab-secret
