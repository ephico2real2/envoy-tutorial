# What lets the Gateway fetch Keycloak's public keys from INSIDE the cluster -
# straight from its Service, not through the router.
#
# A ReferenceGrant: a resource in one namespace may not point at a Service in
# another unless that namespace says so. Here: SecurityPolicies in envoy-17 may
# reference Services in keycloak.
#
# The TLS to that Service - the CA to trust, the name to expect - is module 16's
# BackendTLSPolicy keycloak/keycloak-service (../../16-keycloak/manifests/
# 70-backend-tls-policy.yaml): a Service port takes one, and every Gateway that
# calls Keycloak uses it.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: envoy-17-fetches-jwks
  namespace: keycloak
spec:
  from:
  - { group: gateway.envoyproxy.io, kind: SecurityPolicy, namespace: envoy-17 }
  to:
  - { group: "", kind: Service, name: keycloak-service }
