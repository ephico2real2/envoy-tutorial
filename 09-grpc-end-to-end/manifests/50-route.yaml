# gRPC from outside the cluster: passthrough, so the TLS - and the ALPN "h2"
# a gRPC client insists on - reach Envoy untouched (module 08 compared the
# Route types).
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: grpc
spec:
  host: grpc.apps-crc.testing
  to: { kind: Service, name: envoy }
  port: { targetPort: https }
  tls: { termination: passthrough }
