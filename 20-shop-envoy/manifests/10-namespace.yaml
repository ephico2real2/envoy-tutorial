# Module 20's namespace: the shop (vendored, 20-28), its front Envoy (70, 71), the
# NetworkPolicies that make that Envoy the only way in (30), and the Route (80).
apiVersion: v1
kind: Namespace
metadata:
  name: envoy-20
  annotations:
    # Argo CD never prunes this namespace, as with keycloak's and ingress-shard's
    # (../../argocd/README.md): were a later commit on main to drop or rename this
    # document, automated prune would delete the namespace and everything in it, the
    # shop's database claim included. ../run.sh clean is the one way to remove it.
    argocd.argoproj.io/sync-options: Prune=false
