# The password Keycloak binds to the directory with, as
# cn=keycloak-bind-serviceid,ou=TrustedApplications,dc=ephico2real,dc=com - an
# account that may read ou=People and ou=Groups and nothing else: no writes,
# not userPassword (the directory's ACL, group-sync-operator-helm-chart#71).
#
# The realm import (20-realm.yaml) does not carry the password: it names this
# Secret as a placeholder, and the operator hands the value to the import Job.
# So the realm file can live in git while the credential does not have to.
#
# LAB ONLY: the value is the directory's published test value
# (setup-local-ldap-testing/README.md in the chart repository), written here
# like every credential in this lab so the steps can be repeated. Outside a lab
# the Secret comes from a vault, and this file does not exist.
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-ldap-bind
  namespace: keycloak
stringData:
  password: keycloakbindpassword123
