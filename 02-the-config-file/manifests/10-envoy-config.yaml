# Module 02 — the same proxy as 01, with the fields that were left at their
# defaults now set explicitly, so you can see what each one does.
#
# Nothing here is exotic. These are the fields you end up setting on almost
# every real Envoy, and the module's README explains each one's default and
# when to change it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy-config
data:
  envoy.yaml: |
    # node identifies this Envoy to a control plane and labels its stats.
    # Optional for a static config, but it costs nothing and makes logs and
    # metrics from several proxies tellable apart.
    node:
      id: tutorial-envoy
      cluster: envoy-tutorial

    admin:
      address:
        socket_address: { address: 0.0.0.0, port_value: 9901 }

    static_resources:
      listeners:
      - name: http_listener
        address:
          socket_address: { address: 0.0.0.0, port_value: 8080 }
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: ingress_http
              use_remote_address: true

              # What happens to the upstream's Server response header. The
              # default, OVERWRITE, replaces it with server_name, which defaults
              # to "envoy" (measured on module 01: the app sends
              # "BaseHTTP/0.6 Python/3.12.14", the client sees "envoy").
              # Written out here to make the choice visible; server_name stops
              # the response advertising Envoy at all.
              server_header_transformation: OVERWRITE
              server_name: tutorial-gateway

              # Mint an x-request-id when the client did not send one. On by
              # default - module 01 shows the header without this line. Written
              # out so turning it off is a visible decision.
              generate_request_id: true

              # How long Envoy waits to RECEIVE the whole request from the
              # client; disarmed once the request is sent upstream or the
              # response starts. Unset, there is no limit (API reference), so a
              # slow client can hold a request open indefinitely. Not the same
              # timer as the route's `timeout` below, which does default to 15s.
              request_timeout: 10s

              # How long a downstream connection may sit idle before Envoy
              # closes it. Default 1 hour - usually too long behind a load
              # balancer with a shorter idle timeout of its own.
              common_http_protocol_options:
                idle_timeout: 60s

              access_log:
              - name: envoy.access_loggers.stdout
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                  log_format:
                    json_format:
                      # JSON, because access logs are read by machines far more
                      # often than by people. Every % token is documented under
                      # "access log command operators".
                      start:     "%START_TIME%"
                      method:    "%REQ(:METHOD)%"
                      path:      "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
                      protocol:  "%PROTOCOL%"
                      code:      "%RESPONSE_CODE%"
                      flags:     "%RESPONSE_FLAGS%"
                      duration:  "%DURATION%"
                      upstream:  "%UPSTREAM_HOST%"
                      req_id:    "%REQ(X-REQUEST-ID)%"
                      bytes_in:  "%BYTES_RECEIVED%"
                      bytes_out: "%BYTES_SENT%"

              route_config:
                name: local_route
                virtual_hosts:
                - name: everything
                  domains: ["*"]
                  routes:
                  - match: { prefix: "/" }
                    route:
                      cluster: echo_service
                      # The upstream deadline: from the request being sent on
                      # to the response being fully received. Default 15s
                      # (module 01 measures 15000 ms). 0s means no timeout -
                      # a decision, not a default to drift into.
                      timeout: 5s
                      retry_policy:
                        # Retries are OFF unless a retry_policy is set.
                        # connect-failure: the connection never established.
                        # refused-stream: the upstream refused the stream before
                        #   processing it - Envoy's docs call it safe to retry.
                        # unavailable: the gRPC status 14. gRPC itself warns this
                        #   "is not always safe to retry" for non-idempotent calls.
                        retry_on: "connect-failure,refused-stream,unavailable"
                        num_retries: 2
                        per_try_timeout: 2s

              http_filters:
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

      clusters:
      - name: echo_service
        type: STRICT_DNS
        lb_policy: ROUND_ROBIN
        connect_timeout: 2s
        # How often STRICT_DNS re-resolves. Default 5s. Shorter means faster
        # reaction when pods are replaced, at the cost of more DNS queries.
        dns_refresh_rate: 5s
        # Caps on what Envoy will do to this upstream. Unset, max_connections,
        # max_pending_requests and max_requests default to 1024 and max_retries
        # to 3 (measured on module 01's /clusters) - generous enough that a
        # struggling backend gets buried rather than shielded.
        circuit_breakers:
          thresholds:
          - priority: DEFAULT
            max_connections: 100
            max_pending_requests: 50
            max_requests: 200
            max_retries: 3
        load_assignment:
          cluster_name: echo_service
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address: { address: echo, port_value: 8080 }
