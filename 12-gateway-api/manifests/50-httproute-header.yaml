# The same HTTPRoute as 40-httproute.yaml, with one change: a filter that adds a
# request header on the way to the backend. Applying it is how an app team
# changes its routing - no Envoy config file, no restart. Step 7 times it.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: echo
  namespace: gwapi-demo
spec:
  parentRefs:
  - name: eg
    sectionName: http
  rules:
  - matches:
    - path: { type: PathPrefix, value: / }
    filters:
    - type: RequestHeaderModifier
      requestHeaderModifier:
        add:
        - { name: x-tutorial, value: from-the-httproute }
    backendRefs:
    - name: echo
      port: 8080
