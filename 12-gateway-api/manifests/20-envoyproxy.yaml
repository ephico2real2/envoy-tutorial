# The data-plane equivalent of the Helm values used to install the controller.
#
# Envoy Gateway generates the proxy Deployment itself, so there is no YAML to
# edit - this resource is the supported way to influence it.
#
# The securityContext below does not get the pod past OpenShift's restricted-v2.
# Envoy Gateway v1.9.1 puts runAsUser 65532 on both proxy containers and merges
# these fields over that default, so the uid - outside the namespace's range -
# stays. What admits the pod is a nonroot-v2 grant to its ServiceAccount
# (README, step 4); not anyuid, which would also allow root.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: openshift-scc
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        pod:
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
        container:
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
      envoyService:
        type: LoadBalancer
        # This cluster's IPAddressPool has autoAssign: false, so MetalLB will
        # not hand out an address unless a Service asks for that pool by name.
        # Without this the Service sits <pending> and the Gateway reports
        #   Programmed=False  AddressNotAssigned
        # while the event log says "no available IPs" - which sounds like an
        # exhausted pool but means "no pool volunteered".
        #   oc get ipaddresspool -A -o custom-columns=NAME:.metadata.name,AUTO:.spec.autoAssign
        annotations:
          metallb.universe.tf/address-pool: mongot-pool
