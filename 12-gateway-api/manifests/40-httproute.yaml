# An HTTPRoute attaches to a Gateway listener and says where matching traffic
# goes. This is the portable half of the API: the same file works on any
# Gateway implementation.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: echo
  namespace: gwapi-demo
spec:
  parentRefs:
  - name: eg
    sectionName: http        # attach to the listener named "http"
  rules:
  - matches:
    - path: { type: PathPrefix, value: / }
    backendRefs:
    - name: echo
      port: 8080
