# Zipkin: collects the spans Envoy sends and serves them back on an API (and a
# UI). In memory only - traces vanish when the pod restarts. Fine for learning.
apiVersion: v1
kind: Service
metadata:
  name: zipkin
  labels: { app: zipkin }
spec:
  selector: { app: zipkin }
  ports:
  - { name: http, port: 9411, targetPort: 9411 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zipkin
  labels: { app: zipkin }
spec:
  replicas: 1
  selector: { matchLabels: { app: zipkin } }
  template:
    metadata:
      labels: { app: zipkin }
    spec:
      containers:
      - name: zipkin
        image: openzipkin/zipkin-slim:3
        ports:
        - { name: http, containerPort: 9411 }
        readinessProbe:
          httpGet: { path: /health, port: 9411 }
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests: { cpu: "50m",  memory: "256Mi" }
          limits:   { cpu: "500m", memory: "512Mi" }
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: { drop: ["ALL"] }
