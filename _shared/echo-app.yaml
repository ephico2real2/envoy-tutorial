# The echo app used by modules 01-06.
#
# Deliberately trivial: it answers every request with a description of that
# request. No database, no framework, no build. Source lives in a ConfigMap on
# a stock python image, so there is no registry and nothing to push.
#
# The point of the early modules is Envoy. An app with any complexity of its
# own would compete for the reader's attention, so this one has none.
apiVersion: v1
kind: ConfigMap
metadata:
  name: echo-src
data:
  echo.py: |
    """Answers any request with a description of that request."""
    import json, os
    from http.server import BaseHTTPRequestHandler, HTTPServer

    POD = os.environ.get("POD_NAME", "echo")
    PORT = int(os.environ.get("PORT", "8080"))

    class Echo(BaseHTTPRequestHandler):
        def _reply(self):
            body = json.dumps({
                "served_by": POD,
                "method": self.command,
                "path": self.path,
                # Echoing the headers back is what makes Envoy visible: you can
                # see x-forwarded-for, x-envoy-* and the Host it chose to send.
                "headers": {k.lower(): v for k, v in self.headers.items()},
            }, indent=2).encode()
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        do_GET = do_POST = do_PUT = do_DELETE = do_PATCH = _reply

        # The default handler logs to stderr in a noisy format; quiet it so the
        # pod log shows only what we print deliberately.
        def log_message(self, fmt, *args):
            print("%s %s" % (self.command, self.path), flush=True)

    print("echo listening on :%d as %s" % (PORT, POD), flush=True)
    HTTPServer(("0.0.0.0", PORT), Echo).serve_forever()
---
apiVersion: v1
kind: Service
metadata:
  name: echo
  labels: { app: echo }
spec:
  # Headless from the start. Module 05 explains why this single line is what
  # makes load balancing possible at all; the earlier modules simply inherit a
  # setup that is not quietly wrong.
  clusterIP: None
  selector: { app: echo }
  ports:
  - { name: http, port: 8080, targetPort: 8080 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  labels: { app: echo }
spec:
  replicas: 2
  selector: { matchLabels: { app: echo } }
  template:
    metadata:
      labels: { app: echo }
    spec:
      containers:
      - name: echo
        image: python:3.12-slim
        command: ["python", "/app/echo.py"]
        env:
        - name: POD_NAME
          valueFrom: { fieldRef: { fieldPath: metadata.name } }
        ports:
        - { name: http, containerPort: 8080 }
        readinessProbe:
          httpGet: { path: /healthz, port: 8080 }
          initialDelaySeconds: 2
          periodSeconds: 5
        resources:
          requests: { cpu: "10m",  memory: "32Mi" }
          limits:   { cpu: "200m", memory: "128Mi" }
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: { drop: ["ALL"] }
        volumeMounts:
        - { name: src, mountPath: /app }
      volumes:
      - name: src
        configMap: { name: echo-src }
