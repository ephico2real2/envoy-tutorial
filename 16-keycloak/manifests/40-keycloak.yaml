# One Keycloak server, run by the operator.
#
# LAB ONLY: the administrator's user name and password are published here, like
# every other credential in this lab, so the steps can be repeated as written.
# Keycloak reads them once, when it first creates its database (bootstrapAdmin);
# without this, the operator generates a random temporary admin instead.
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-admin
  namespace: keycloak
stringData:
  username: admin
  password: lab-only-admin-password
---
apiVersion: k8s.keycloak.org/v2beta1
kind: Keycloak
metadata:
  name: keycloak
  namespace: keycloak
spec:
  instances: 1
  bootstrapAdmin:
    user:
      secret: keycloak-admin
  db:
    vendor: postgres
    host: postgres
    database: keycloak
    usernameSecret: { name: keycloak-db, key: username }
    passwordSecret: { name: keycloak-db, key: password }
  http:
    # Keycloak serves HTTPS itself, with the certificate from 30-certificate.
    tlsSecret: keycloak-tls
  hostname:
    # The public name: it goes into every token's issuer (iss) and every URL
    # Keycloak writes into its discovery document.
    hostname: https://keycloak.apps-crc.testing
  # The operator can create an Ingress; this lab uses an explicit passthrough
  # Route instead (50-route.yaml), so the TLS path is plain to see.
  ingress:
    enabled: false
  resources:
    requests: { cpu: "200m", memory: "1Gi" }
    limits:   { memory: "2Gi" }
